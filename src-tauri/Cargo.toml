[package]
name = "openwrt-companion"
version = "1.2.1"
description = "OpenWrt Companion - tray companion for your OpenWrt router"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "rt-multi-thread", "macros"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography", "Win32_Foundation"] }

[lib]
name = "openwrt_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
